spring:
  application:
    name: api-gateway
  cloud:
    config:
      uri: http://localhost:8888
      username: admin
      password: ${CONFIG_PASSWORD:admin123}
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
